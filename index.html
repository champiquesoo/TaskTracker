<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --paper:#E9EAE1;
    --paper-raised:#F3F3EC;
    --ink:#1F2A38;
    --ink-soft:#5A6472;
    --line:#1F2A3822;
    --today:#B8862E;
    --pending:#3E5C76;
    --storage:#5F7A5C;
    --overdue:#A14444;
    --soon:#B8862E;
    --neutral:#8B8F86;
    --unread:#A14444;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:transparent;color:var(--ink);font-family:'Inter',sans-serif;}
  .board-wrap{background:var(--paper);border:1px solid var(--line);min-height:520px;padding:26px 24px 30px;}

  .board-header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid var(--ink);padding-bottom:14px;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .board-title{font-family:'Fraunces',serif;font-size:26px;font-weight:600;letter-spacing:-0.01em;margin:0;}
  .board-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;}
  .identity{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);}
  .identity-name{font-family:'IBM Plex Mono',monospace;background:var(--paper-raised);border:1px solid var(--line);padding:3px 9px;color:var(--ink);}
  .identity-role{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);}
  .identity button{background:none;border:none;color:var(--ink-soft);font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;padding:0;}

  .view-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .view-tab{font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;background:none;border:none;color:var(--ink-soft);padding:8px 14px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .view-tab.active{color:var(--ink);border-bottom-color:var(--ink);}

  .toolbar{display:flex;justify-content:flex-end;margin-bottom:16px;}
  .new-task-btn{font-family:'Inter',sans-serif;font-size:12.5px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 14px;cursor:pointer;}
  .new-task-btn:hover{opacity:0.85;}

  .columns{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media(max-width:760px){.columns{grid-template-columns:1fr;}}

  .col-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .col-label{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;font-weight:500;}
  .col-sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-soft);display:block;margin-top:2px;}
  .col-count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .col-rule{height:2px;margin-bottom:14px;}
  .col-today .col-label{color:var(--today);} .col-today .col-rule{background:var(--today);}
  .col-nearfuture .col-label{color:var(--pending);} .col-nearfuture .col-rule{background:var(--pending);}
  .col-pending .col-label{color:var(--neutral);} .col-pending .col-rule{background:var(--neutral);}

  .card-list{display:flex;flex-direction:column;gap:10px;min-height:40px;}
  .card{background:var(--paper-raised);border:1px solid var(--line);border-left:3px solid transparent;padding:11px 12px 10px;cursor:pointer;}
  .col-today .card{border-left-color:var(--today);}
  .col-nearfuture .card{border-left-color:var(--pending);}
  .col-pending .card{border-left-color:var(--neutral);}
  .card-id{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);letter-spacing:0.04em;display:flex;justify-content:space-between;align-items:center;}
  .unread-badge{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:600;background:var(--unread);color:#fff;padding:1px 6px;border-radius:8px;}
  .card-title{font-size:14px;font-weight:500;margin:3px 0 2px;line-height:1.35;}
  .card-tags{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0 6px;}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:0.04em;padding:2px 6px;border:1px solid var(--line);color:var(--ink-soft);}
  .tag.deadline-overdue{color:#fff;background:var(--overdue);border-color:var(--overdue);}
  .tag.deadline-soon{color:#fff;background:var(--soon);border-color:var(--soon);}
  .tag.stage-notstarted, .tag.stage-drafting{color:var(--neutral);border-color:var(--neutral);}
  .tag.stage-inreview{color:var(--pending);border-color:var(--pending);}
  .tag.stage-revising{color:#fff;background:var(--today);border-color:var(--today);}
  .tag.stage-delivered, .tag.stage-approved{color:#fff;background:var(--storage);border-color:var(--storage);}
  .card-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);}
  .card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .complete-btn{font-family:'Inter',sans-serif;font-size:10.5px;border:1px solid var(--storage);background:none;color:var(--storage);padding:3px 8px;cursor:pointer;}
  .complete-btn:hover{background:var(--storage);color:#fff;}
  .reopen-btn{font-family:'Inter',sans-serif;font-size:10.5px;border:1px solid var(--line);background:none;color:var(--ink-soft);padding:3px 8px;cursor:pointer;}
  .reopen-btn:hover{border-color:var(--ink-soft);color:var(--ink);}

  .empty-hint{font-size:12px;color:var(--ink-soft);font-style:italic;padding:6px 2px;}

  .table-actions{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .export-btn{font-family:'Inter',sans-serif;font-size:12px;border:1px solid var(--ink);background:none;color:var(--ink);padding:6px 12px;cursor:pointer;}
  .export-btn:hover{background:var(--ink);color:var(--paper);}
  table.task-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.task-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);border-bottom:1.5px solid var(--ink);padding:6px 8px;}
  table.task-table td{padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top;cursor:pointer;}
  table.task-table tr:hover td{background:var(--paper-raised);}
  .status-badge{font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);}
  .status-badge.today{color:var(--today);border-color:var(--today);}
  .status-badge.nearfuture{color:var(--pending);border-color:var(--pending);}
  .status-badge.pending{color:var(--neutral);border-color:var(--neutral);}
  .status-badge.storage{color:var(--storage);border-color:var(--storage);}

  .agenda-item{background:var(--paper-raised);border:1px solid var(--line);border-left:3px solid var(--today);padding:14px 15px;margin-bottom:12px;cursor:pointer;}
  .agenda-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .agenda-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
  .agenda-note{font-size:13px;color:var(--ink-soft);line-height:1.5;margin:6px 0 8px;}
  .agenda-foot{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);flex-wrap:wrap;gap:8px;}
  .agenda-link{font-size:12px;color:var(--pending);text-decoration:none;border-bottom:1px solid var(--pending);}

  .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .cal-nav{display:flex;gap:6px;align-items:center;}
  .cal-nav button{font-family:'IBM Plex Mono',monospace;font-size:12px;border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);padding:4px 10px;cursor:pointer;}
  .cal-nav button:hover{border-color:var(--ink);}
  .cal-month-label{font-family:'Fraunces',serif;font-size:18px;font-weight:600;min-width:150px;text-align:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
  .cal-dow{background:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding:6px 0;}
  .cal-cell{background:var(--paper-raised);min-height:88px;padding:5px;position:relative;}
  .cal-cell.blank{background:var(--paper);}
  .cal-cell.is-today{outline:2px solid var(--today);outline-offset:-2px;}
  .cal-daynum{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);}
  .cal-chip{font-size:10px;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--pending);padding:2px 5px;margin-top:3px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-chip.overdue{border-left-color:var(--overdue);}
  .cal-chip.done{border-left-color:var(--storage);opacity:0.6;text-decoration:line-through;}
  @media(max-width:760px){.cal-cell{min-height:60px;} .cal-dow{font-size:8px;}}

  .modal-backdrop{position:fixed;inset:0;background:#1F2A3888;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .id-modal{background:var(--paper);border:1px solid var(--ink);padding:24px 26px;width:300px;}
  .id-modal h3{font-family:'Fraunces',serif;margin:0 0 6px;font-size:19px;}
  .id-modal p{font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;}
  .id-modal input{width:100%;font-family:'Inter',sans-serif;font-size:14px;border:1px solid var(--line);padding:8px 9px;margin-bottom:12px;}
  .role-btn{width:100%;text-align:left;font-family:'Inter',sans-serif;font-size:13px;border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);padding:10px 11px;margin-bottom:8px;cursor:pointer;}
  .role-btn small{display:block;color:var(--ink-soft);font-size:11px;margin-top:2px;}
  .role-btn:hover{border-color:var(--ink);}

  .detail-modal{background:var(--paper);border:1px solid var(--ink);width:440px;max-width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px;}
  .detail-modal h3{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px;}
  .detail-modal .card-id{margin-bottom:10px;}
  .detail-field{margin-bottom:12px;}
  .detail-field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:4px;}
  .detail-field input, .detail-field select, .detail-field textarea{width:100%;font-family:'Inter',sans-serif;font-size:13px;border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);padding:6px 8px;}
  .detail-field .readonly{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink);padding:6px 0;}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .detail-actions{display:flex;gap:8px;margin-top:6px;margin-bottom:16px;flex-wrap:wrap;}
  .detail-actions button{font-family:'Inter',sans-serif;font-size:12px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:7px 12px;cursor:pointer;}
  .detail-actions button.secondary{background:none;color:var(--ink);}
  .detail-actions button.complete{background:var(--storage);border-color:var(--storage);}
  .detail-actions button.danger{background:none;color:var(--overdue);border-color:var(--overdue);}
  .close-x{position:sticky;top:0;float:right;background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-soft);}

  .comments{border-top:1.5px solid var(--ink);padding-top:12px;margin-top:6px;}
  .comments h4{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;margin:0 0 10px;}
  .comment{background:var(--paper-raised);border:1px solid var(--line);padding:8px 9px;margin-bottom:8px;}
  .comment-author{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);display:flex;justify-content:space-between;margin-bottom:3px;}
  .comment-text{font-size:12.5px;line-height:1.4;}
  .comment-form{display:flex;gap:6px;margin-top:8px;}
  .comment-form textarea{flex:1;font-family:'Inter',sans-serif;font-size:12.5px;border:1px solid var(--line);padding:6px 8px;resize:none;}
  .comment-form button{font-family:'Inter',sans-serif;font-size:12px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:0 12px;cursor:pointer;}

  .status-line{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);text-align:right;margin-top:18px;}
</style>
</head>
<body>

<div class="board-wrap" id="boardWrap">
  <div class="board-header">
    <div>
      <p class="board-title">Task Board</p>
      <p class="board-date" id="dateLine"></p>
    </div>
    <div class="identity">
      <span>Viewing as</span>
      <span class="identity-name" id="identityName">-</span>
      <span class="identity-role" id="identityRole"></span>
      <button id="changeIdentity">switch</button>
    </div>
  </div>

  <div class="view-tabs">
    <button class="view-tab active" data-view="board">Board</button>
    <button class="view-tab" data-view="today">Today's Agenda</button>
    <button class="view-tab" data-view="table">Table</button>
    <button class="view-tab" data-view="calendar">Calendar</button>
  </div>

  <div id="viewArea"></div>
  <div class="status-line" id="statusLine">loading...</div>
</div>

<div class="modal-backdrop" id="idModal" style="display:none;">
  <div class="id-modal">
    <h3>Who are you?</h3>
    <p>Your name is saved on this device to identify your activity on the shared board.</p>
    <input type="text" id="idInput" placeholder="e.g. Ana" maxlength="24" />
    <button class="role-btn" data-role="owner">Owner<small>Create, edit and move tasks</small></button>
    <button class="role-btn" data-role="reviewer">Reviewer<small>View progress and add comments only</small></button>
  </div>
</div>

<div class="modal-backdrop" id="detailModal" style="display:none;"></div>
<div class="modal-backdrop" id="addModal" style="display:none;"></div>

<script>
(function(){
  const BOARD_COLS = [
    {key:'today', label:'Today', sub:'due today or overdue'},
    {key:'nearfuture', label:'Near Future', sub:'due after today'},
    {key:'pending', label:'Pending', sub:'no deadline yet'}
  ];
  const BUCKET_LABEL = {today:'Today', nearfuture:'Near Future', pending:'Pending', storage:'Storage'};
  const STAGES = ['Not started','Drafting','In review','Revising','Delivered','Approved'];
  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function stageSlug(s){ return (s||'notstarted').toLowerCase().replace(/[^a-z]/g,''); }

  let tasks = [];
  let identity = null;
  let commentReads = {};
  let nextSeq = 1;
  let currentView = 'board';
  let calMonth = new Date(); calMonth.setDate(1);

  const viewArea = document.getElementById('viewArea');
  const statusLine = document.getElementById('statusLine');
  const dateLine = document.getElementById('dateLine');

  dateLine.textContent = new Date().toLocaleDateString('en-US', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function fmtDate(ts){ if(!ts) return '-'; const d = typeof ts === 'number' ? new Date(ts) : new Date(ts); return d.toLocaleDateString('en-US',{day:'2-digit',month:'short',year:'2-digit'}); }
  function daysUntil(dateStr){ if(!dateStr) return null; const d = new Date(dateStr+'T00:00:00'); const t = new Date(todayISO()+'T00:00:00'); return Math.round((d-t)/86400000); }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function isOwner(){ return identity && identity.role === 'owner'; }
  function stageOptionsHtml(selected){ return STAGES.map(s => `<option value="${s}" ${s===selected?'selected':''}>${s}</option>`).join(''); }
  function stageLabel(t){
    if(!t.stage || t.stage === 'Not started') return t.version ? `${t.version} - Not started` : 'Not started';
    return t.version ? `${t.version} - ${t.stage}` : t.stage;
  }
  function getBucket(t){
    if(t.status === 'storage') return 'storage';
    if(!t.deadline) return 'pending';
    return daysUntil(t.deadline) <= 0 ? 'today' : 'nearfuture';
  }
  function unreadCount(t){
    if(!identity) return 0;
    const last = commentReads[t.id] || 0;
    return (t.comments||[]).filter(c => c.ts > last && c.author !== identity.name).length;
  }
  function unreadBadge(t){
    const n = unreadCount(t);
    return n ? `<span class="unread-badge">${n} new</span>` : '';
  }

  async function loadIdentity(){
    try{
      const res = await window.storage.get('board-identity', false);
      if(res && res.value) identity = JSON.parse(res.value);
    }catch(e){}
    try{
      const res2 = await window.storage.get('comment-reads', false);
      if(res2 && res2.value) commentReads = JSON.parse(res2.value);
    }catch(e){}
    if(!identity){ document.getElementById('idModal').style.display = 'flex'; }
    else{ reflectIdentity(); }
  }
  function reflectIdentity(){
    document.getElementById('identityName').textContent = identity.name;
    document.getElementById('identityRole').textContent = identity.role === 'owner' ? 'OWNER' : 'REVIEWER';
    document.getElementById('idModal').style.display = 'none';
  }
  async function saveIdentity(name, role){
    identity = {name, role};
    reflectIdentity();
    try{ await window.storage.set('board-identity', JSON.stringify(identity), false); }catch(e){ console.error(e); }
    render();
  }
  document.querySelectorAll('.role-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = document.getElementById('idInput').value.trim();
      if(!val){ document.getElementById('idInput').focus(); return; }
      saveIdentity(val, btn.dataset.role);
    });
  });
  document.getElementById('changeIdentity').addEventListener('click', () => {
    document.getElementById('idInput').value = identity ? identity.name : '';
    document.getElementById('idModal').style.display = 'flex';
  });

  async function loadTasks(){
    try{
      const res = await window.storage.get('tasks-board', true);
      tasks = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){ tasks = []; }
    tasks.forEach(t => {
      if(!t.stage) t.stage = 'Not started';
      if(t.status !== 'storage') t.status = 'active';
    });
    nextSeq = tasks.reduce((m,t) => Math.max(m, t.seq||0), 0) + 1;
    statusLine.textContent = 'synced - shared board';
    render();
  }
  async function saveTasks(){
    try{
      const result = await window.storage.set('tasks-board', JSON.stringify(tasks), true);
      statusLine.textContent = result ? 'saved' : 'save failed';
    }catch(e){ statusLine.textContent = 'save error'; console.error(e); }
  }
  async function saveReads(){
    try{ await window.storage.set('comment-reads', JSON.stringify(commentReads), false); }catch(e){}
  }

  function addTask(title, note, link, deadline, version, stage){
    tasks.push({
      id: 't' + Date.now() + Math.random().toString(16).slice(2),
      seq: nextSeq++,
      title, note: note || '', link: link || '',
      version: version || '', stage: stage || 'Not started',
      deadline: deadline || '',
      status: 'active',
      startDate: Date.now(),
      completedDate: null,
      owner: identity.name,
      comments: []
    });
    saveTasks(); render();
  }
  function updateTask(id, patch){
    const t = tasks.find(x => x.id === id);
    if(!t) return;
    if(patch.status && patch.status !== t.status){
      t.completedDate = patch.status === 'storage' ? Date.now() : null;
    }
    Object.assign(t, patch);
    saveTasks(); render();
  }
  function markComplete(id){ updateTask(id, {status: 'storage', stage: 'Delivered'}); }
  function reopenTask(id){ updateTask(id, {status: 'active'}); }
  function deleteTask(id){ tasks = tasks.filter(x => x.id !== id); saveTasks(); render(); closeDetail(); }
  function addComment(id, text){
    const t = tasks.find(x => x.id === id);
    if(!t) return;
    t.comments = t.comments || [];
    t.comments.push({author: identity.name, text, ts: Date.now()});
    saveTasks();
  }

  document.querySelectorAll('.view-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentView = btn.dataset.view;
      document.querySelectorAll('.view-tab').forEach(b => b.classList.toggle('active', b === btn));
      render();
    });
  });

  function render(){
    if(!identity){ viewArea.innerHTML=''; return; }
    if(currentView === 'board') renderBoard();
    else if(currentView === 'today') renderToday();
    else if(currentView === 'table') renderTable();
    else renderCalendar();
  }

  function tagsHtml(t){
    let tags = `<span class="tag stage-${stageSlug(t.stage)}">${escapeHtml(stageLabel(t))}</span>`;
    if(t.deadline){
      const d = daysUntil(t.deadline);
      let cls = '';
      if(d !== null && d < 0 && t.status !== 'storage') cls = 'deadline-overdue';
      else if(d !== null && d <= 3) cls = 'deadline-soon';
      tags += `<span class="tag ${cls}">Due ${fmtDate(t.deadline)}</span>`;
    }
    return `<div class="card-tags">${tags}</div>`;
  }
  function cardFootHtml(t){
    if(!isOwner()) return '';
    if(t.status === 'storage') return `<div class="card-foot"><button class="reopen-btn" data-reopen="${t.id}">Reopen</button></div>`;
    return `<div class="card-foot"><button class="complete-btn" data-complete="${t.id}">Mark complete</button></div>`;
  }
  function wireCardActions(root){
    root.querySelectorAll('[data-complete]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); markComplete(btn.dataset.complete); }));
    root.querySelectorAll('[data-reopen]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); reopenTask(btn.dataset.reopen); }));
  }

  // ---------- add task modal ----------
  function openAddModal(){
    const modal = document.getElementById('addModal');
    modal.innerHTML = `
      <div class="detail-modal">
        <button class="close-x" id="closeAdd">X</button>
        <h3>New task</h3>
        <div class="detail-field"><label>Title</label><input type="text" id="a-title" maxlength="80" /></div>
        <div class="detail-field"><label>Note</label><textarea id="a-note" rows="2" maxlength="300"></textarea></div>
        <div class="detail-field"><label>Deliverable link</label><input type="text" id="a-link" placeholder="https://..." maxlength="300" /></div>
        <div class="detail-grid">
          <div class="detail-field"><label>Version</label><input type="text" id="a-version" placeholder="e.g. V1" maxlength="20" /></div>
          <div class="detail-field"><label>Stage</label><select id="a-stage">${stageOptionsHtml('Not started')}</select></div>
        </div>
        <div class="detail-field"><label>Deadline (leave blank for Pending)</label><input type="date" id="a-deadline" /></div>
        <div class="detail-actions"><button id="a-save">Save task</button><button class="secondary" id="a-cancel">Cancel</button></div>
      </div>`;
    modal.style.display = 'flex';
    document.getElementById('closeAdd').addEventListener('click', closeAddModal);
    document.getElementById('a-cancel').addEventListener('click', closeAddModal);
    modal.addEventListener('click', (e) => { if(e.target === modal) closeAddModal(); });
    document.getElementById('a-save').addEventListener('click', () => {
      const title = document.getElementById('a-title').value.trim();
      if(!title){ document.getElementById('a-title').focus(); return; }
      addTask(
        title,
        document.getElementById('a-note').value.trim(),
        document.getElementById('a-link').value.trim(),
        document.getElementById('a-deadline').value,
        document.getElementById('a-version').value.trim(),
        document.getElementById('a-stage').value
      );
      closeAddModal();
    });
  }
  function closeAddModal(){ document.getElementById('addModal').style.display = 'none'; }

  function toolbarHtml(){
    return isOwner() ? `<div class="toolbar"><button class="new-task-btn" id="openAdd">+ New Task</button></div>` : '';
  }
  function wireToolbar(root){
    const btn = root.querySelector('#openAdd');
    if(btn) btn.addEventListener('click', openAddModal);
  }

  function renderBoard(){
    viewArea.innerHTML = toolbarHtml() + `<div class="columns">${BOARD_COLS.map(col => {
      let colTasks = tasks.filter(t => getBucket(t) === col.key);
      if(col.key === 'nearfuture') colTasks.sort((a,b) => a.deadline.localeCompare(b.deadline));
      else if(col.key === 'today') colTasks.sort((a,b) => (a.deadline||'').localeCompare(b.deadline||''));
      else colTasks.sort((a,b) => b.startDate - a.startDate);
      return `
        <div class="col col-${col.key}">
          <div class="col-head"><span class="col-label">${col.label}<span class="col-sub">${col.sub}</span></span><span class="col-count">${colTasks.length}</span></div>
          <div class="col-rule"></div>
          <div class="card-list">
            ${colTasks.length ? colTasks.map(t => `
              <div class="card" data-open="${t.id}">
                <div class="card-id"><span>T-${String(t.seq).padStart(3,'0')}</span>${unreadBadge(t)}</div>
                <div class="card-title">${escapeHtml(t.title)}</div>
                ${tagsHtml(t)}
                <div class="card-meta">${escapeHtml(t.owner)} - started ${fmtDate(t.startDate)}</div>
                ${cardFootHtml(t)}
              </div>`).join('') : '<div class="empty-hint">No tasks here.</div>'}
          </div>
        </div>`;
    }).join('')}</div>`;
    wireToolbar(viewArea);
    wireCardActions(viewArea);
    viewArea.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openDetail(el.dataset.open)));
  }

  function renderToday(){
    const todays = tasks.filter(t => getBucket(t) === 'today').sort((a,b) => (a.deadline||'').localeCompare(b.deadline||''));
    viewArea.innerHTML = toolbarHtml() + `
      ${todays.length ? todays.map(t => `
        <div class="agenda-item" data-open="${t.id}">
          <div class="agenda-top"><span class="agenda-title">T-${String(t.seq).padStart(3,'0')} - ${escapeHtml(t.title)}</span>${unreadBadge(t)}</div>
          ${tagsHtml(t)}
          ${t.note ? `<div class="agenda-note">${escapeHtml(t.note)}</div>` : ''}
          <div class="agenda-foot">
            <span>${escapeHtml(t.owner)} - started ${fmtDate(t.startDate)} ${t.deadline ? '- due ' + fmtDate(t.deadline) : ''}</span>
            <span>${t.link ? `<a class="agenda-link" href="${escapeHtml(t.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open deliverable</a>` : ''} ${(t.comments||[]).length ? ' - ' + t.comments.length + ' comment(s)' : ''}</span>
          </div>
          ${isOwner() ? `<div class="card-foot"><button class="complete-btn" data-complete="${t.id}">Mark complete</button></div>` : ''}
        </div>`).join('') : '<div class="empty-hint">Nothing due today. Tasks land here automatically once their deadline is today or earlier.</div>'}
    `;
    wireToolbar(viewArea);
    wireCardActions(viewArea);
    viewArea.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openDetail(el.dataset.open)));
  }

  function renderTable(){
    const bOrder = {today:0, nearfuture:1, pending:2, storage:3};
    const sorted = [...tasks].sort((a,b) => (bOrder[getBucket(a)]-bOrder[getBucket(b)]) || (a.deadline||'9999').localeCompare(b.deadline||'9999'));
    viewArea.innerHTML = `
      <div class="table-actions">
        <button class="export-btn" id="exportCsv">Download CSV</button>
        <button class="export-btn" id="exportSummary">Download summary (.txt)</button>
      </div>
      <table class="task-table">
        <thead><tr><th>ID</th><th>Title</th><th>Bucket</th><th>Stage note</th><th>Start</th><th>Deadline</th><th>Completed</th><th>Owner</th><th></th></tr></thead>
        <tbody>
        ${sorted.length ? sorted.map(t => `
          <tr data-open="${t.id}">
            <td>T-${String(t.seq).padStart(3,'0')}</td>
            <td>${escapeHtml(t.title)}</td>
            <td><span class="status-badge ${getBucket(t)}">${BUCKET_LABEL[getBucket(t)]}</span></td>
            <td>${escapeHtml(stageLabel(t))}</td>
            <td>${fmtDate(t.startDate)}</td>
            <td>${t.deadline ? fmtDate(t.deadline) : '-'}</td>
            <td>${t.completedDate ? fmtDate(t.completedDate) : '-'}</td>
            <td>${escapeHtml(t.owner)}</td>
            <td>${unreadBadge(t)}</td>
          </tr>`).join('') : '<tr><td colspan="9" class="empty-hint">No tasks yet.</td></tr>'}
        </tbody>
      </table>`;
    viewArea.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openDetail(el.dataset.open)));
    document.getElementById('exportCsv').addEventListener('click', () => downloadFile(buildCsv(sorted), 'task-board.csv', 'text/csv'));
    document.getElementById('exportSummary').addEventListener('click', () => downloadFile(buildSummary(sorted), 'task-board-summary.txt', 'text/plain'));
  }

  function csvEscape(s){ s = (s==null?'':String(s)); if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"'; return s; }
  function buildCsv(list){
    const headers = ['ID','Title','Bucket','Version','Stage','Note','Deliverable link','Start date','Deadline','Completed date','Owner','Comments'];
    const rows = list.map(t => [
      'T-'+String(t.seq).padStart(3,'0'), t.title, BUCKET_LABEL[getBucket(t)],
      t.version, t.stage, t.note, t.link,
      fmtDate(t.startDate), t.deadline ? fmtDate(t.deadline) : '', t.completedDate ? fmtDate(t.completedDate) : '',
      t.owner, (t.comments||[]).map(c => `${c.author}: ${c.text}`).join(' | ')
    ]);
    return [headers, ...rows].map(r => r.map(csvEscape).join(',')).join('\r\n');
  }
  function buildSummary(list){
    let out = `TASK BOARD SUMMARY - exported ${fmtDate(Date.now())}\n${'='.repeat(50)}\n\n`;
    ['today','nearfuture','pending','storage'].forEach(key => {
      const group = list.filter(t => getBucket(t) === key);
      if(!group.length) return;
      out += `${BUCKET_LABEL[key].toUpperCase()} (${group.length})\n${'-'.repeat(30)}\n`;
      group.forEach(t => {
        out += `T-${String(t.seq).padStart(3,'0')} - ${t.title}\n`;
        out += `  Stage: ${stageLabel(t)}\n`;
        out += `  Started: ${fmtDate(t.startDate)}${t.deadline ? ' | Deadline: '+fmtDate(t.deadline) : ''}${t.completedDate ? ' | Completed: '+fmtDate(t.completedDate) : ''}\n`;
        if(t.note) out += `  Note: ${t.note}\n`;
        if(t.link) out += `  Link: ${t.link}\n`;
        if((t.comments||[]).length) out += `  Comments:\n` + t.comments.map(c => `    - ${c.author} (${fmtDate(c.ts)}): ${c.text}`).join('\n') + '\n';
        out += '\n';
      });
    });
    return out;
  }
  function downloadFile(content, filename, mime){
    const blob = new Blob([content], {type: mime + ';charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function renderCalendar(){
    const year = calMonth.getFullYear(), month = calMonth.getMonth();
    const firstDow = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const monthLabel = calMonth.toLocaleDateString('en-US', {month:'long', year:'numeric'});
    let cells = '';
    for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell blank"></div>`;
    for(let day=1; day<=daysInMonth; day++){
      const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const dayTasks = tasks.filter(t => t.deadline === iso);
      const isToday = iso === todayISO();
      cells += `<div class="cal-cell ${isToday?'is-today':''}">
        <div class="cal-daynum">${day}</div>
        ${dayTasks.map(t => `<div class="cal-chip ${t.status==='storage'?'done':(daysUntil(t.deadline)<0?'overdue':'')}" data-open="${t.id}" title="${escapeHtml(t.title)}">T-${String(t.seq).padStart(3,'0')} ${escapeHtml(t.title)}</div>`).join('')}
      </div>`;
    }
    viewArea.innerHTML = `
      <div class="cal-header">
        <span class="cal-month-label">${monthLabel}</span>
        <div class="cal-nav"><button id="calPrev">&lt;</button><button id="calTodayBtn">Today</button><button id="calNext">&gt;</button></div>
      </div>
      <div class="cal-grid">${DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
    document.getElementById('calPrev').addEventListener('click', () => { calMonth.setMonth(calMonth.getMonth()-1); renderCalendar(); });
    document.getElementById('calNext').addEventListener('click', () => { calMonth.setMonth(calMonth.getMonth()+1); renderCalendar(); });
    document.getElementById('calTodayBtn').addEventListener('click', () => { calMonth = new Date(); calMonth.setDate(1); renderCalendar(); });
    viewArea.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openDetail(el.dataset.open)));
  }

  function openDetail(id){
    const t = tasks.find(x => x.id === id);
    if(!t) return;
    commentReads[t.id] = Date.now();
    saveReads();
    const modal = document.getElementById('detailModal');
    const owner = isOwner();
    modal.innerHTML = `
      <div class="detail-modal">
        <button class="close-x" id="closeDetail">X</button>
        <div class="card-id">T-${String(t.seq).padStart(3,'0')} <span class="tag">${BUCKET_LABEL[getBucket(t)]}</span></div>
        ${owner ? `<div class="detail-field"><input type="text" id="d-title" value="${escapeHtml(t.title)}" /></div>` : `<h3>${escapeHtml(t.title)}</h3>`}

        <div class="detail-grid">
          <div class="detail-field"><label>Stage</label>
            ${owner ? `<select id="d-stage">${stageOptionsHtml(t.stage)}</select>` : `<div class="readonly">${escapeHtml(t.stage)}</div>`}
          </div>
          <div class="detail-field"><label>Version</label>
            ${owner ? `<input type="text" id="d-version" value="${escapeHtml(t.version)}" placeholder="e.g. V1" />` : `<div class="readonly">${escapeHtml(t.version) || '-'}</div>`}
          </div>
          <div class="detail-field"><label>Deadline</label>
            ${owner ? `<input type="date" id="d-deadline" value="${t.deadline||''}" />` : `<div class="readonly">${t.deadline ? fmtDate(t.deadline) : '-'}</div>`}
          </div>
          <div class="detail-field"><label>Deliverable link</label>
            ${owner ? `<input type="text" id="d-link" value="${escapeHtml(t.link)}" placeholder="https://..." />`
                    : (t.link ? `<div class="readonly"><a href="${escapeHtml(t.link)}" target="_blank" rel="noopener">Open deliverable</a></div>` : `<div class="readonly">-</div>`)}
          </div>
          <div class="detail-field"><label>Start date</label><div class="readonly">${fmtDate(t.startDate)}</div></div>
          <div class="detail-field"><label>Completed date</label><div class="readonly">${t.completedDate ? fmtDate(t.completedDate) : '-'}</div></div>
        </div>

        <div class="detail-field"><label>Note</label>
          ${owner ? `<textarea id="d-note" rows="2" maxlength="300">${escapeHtml(t.note)}</textarea>` : `<div class="readonly">${escapeHtml(t.note) || '-'}</div>`}
        </div>

        ${owner ? `<div class="detail-actions">
          <button id="d-save">Save changes</button>
          ${t.status !== 'storage' ? `<button class="complete" id="d-complete">Mark complete</button>` : `<button class="secondary" id="d-reopen">Reopen</button>`}
          <button class="danger" id="d-delete">Delete task</button>
        </div>` : ''}

        <div class="comments">
          <h4>Comments</h4>
          ${(t.comments||[]).length ? t.comments.map(c => `
            <div class="comment">
              <div class="comment-author"><span>${escapeHtml(c.author)}</span><span>${fmtDate(c.ts)}</span></div>
              <div class="comment-text">${escapeHtml(c.text)}</div>
            </div>`).join('') : '<div class="empty-hint">No comments yet.</div>'}
          <div class="comment-form">
            <textarea id="d-comment" rows="1" placeholder="Add a comment..." maxlength="400"></textarea>
            <button id="d-comment-btn">Post</button>
          </div>
        </div>
      </div>`;
    modal.style.display = 'flex';

    document.getElementById('closeDetail').addEventListener('click', closeDetail);
    modal.addEventListener('click', (e) => { if(e.target === modal) closeDetail(); });

    if(owner){
      document.getElementById('d-save').addEventListener('click', () => {
        updateTask(t.id, {
          title: document.getElementById('d-title').value.trim() || t.title,
          stage: document.getElementById('d-stage').value,
          version: document.getElementById('d-version').value.trim(),
          deadline: document.getElementById('d-deadline').value,
          link: document.getElementById('d-link').value.trim(),
          note: document.getElementById('d-note').value.trim()
        });
        closeDetail();
      });
      const completeBtn = document.getElementById('d-complete');
      if(completeBtn) completeBtn.addEventListener('click', () => { markComplete(t.id); closeDetail(); });
      const reopenBtn = document.getElementById('d-reopen');
      if(reopenBtn) reopenBtn.addEventListener('click', () => { reopenTask(t.id); closeDetail(); });
      document.getElementById('d-delete').addEventListener('click', () => { if(confirm('Delete this task?')) deleteTask(t.id); });
    }
    document.getElementById('d-comment-btn').addEventListener('click', () => {
      const val = document.getElementById('d-comment').value.trim();
      if(val){ addComment(t.id, val); openDetail(t.id); render(); }
    });
    render();
  }
  function closeDetail(){ document.getElementById('detailModal').style.display = 'none'; render(); }

  loadIdentity();
  loadTasks();
})();
</script>
</body>
</html>
